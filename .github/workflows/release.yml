name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Package macOS (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Package the app
        run: corepack pnpm --filter @aura/browser package:mac

      - name: Archive the app bundle
        id: archive
        run: |
          set -euo pipefail
          APP="apps/browser/out/AURA-darwin-arm64/AURA.app"
          test -d "$APP"
          NAME="AURA-${GITHUB_REF_NAME}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NAME"
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" \
            --clobber
